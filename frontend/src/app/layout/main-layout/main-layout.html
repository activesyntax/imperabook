<section class="main">
  <app-workspace class="workspace" />
  <!-- Commands are for a signed-in user: signed out, the side nav offers the few
       that work (login, about, help), and the login form takes the bar's place. -->
  @if (session.signedIn() && !store.loginRequested()) {
    <app-command-shell class="shell" />
  }

  <app-side-nav class="side-nav" [signedIn]="session.signedIn()" [name]="session.user()?.name ?? ''"
    [library]="session.user()?.library ?? ''" [avatarUrl]="session.avatarUrl()" (run)="run($event)" />
</section>
