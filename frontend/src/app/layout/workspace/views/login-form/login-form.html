@let current = fields[step()];

<div class="prompt">
  <img class="avatar" src="/static/imperabook-icon.svg" alt="" aria-hidden="true" />

  <input
    #field
    class="bar"
    [type]="current.type"
    [attr.name]="current.name"
    [attr.autocomplete]="current.autocomplete"
    [attr.aria-label]="current.label"
    [placeholder]="current.label"
    autocapitalize="off"
    spellcheck="false"
    [value]="value()"
    [readOnly]="busy()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)" />

  <button
    type="button"
    class="send"
    [attr.aria-label]="step() === 'username' ? 'Continue' : 'Log in'"
    [disabled]="busy()"
    (mousedown)="$event.preventDefault()"
    (click)="submit()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 12h14" />
      <path d="m13 6 6 6-6 6" />
    </svg>
  </button>
</div>
