<div class="item-collection">
  @if (view().heading || view().page) {
  <header class="item-collection__header">
    @if (view().heading; as heading) {
    <app-heading [text]="heading" />
    }

    @if (view().page; as page) {
    <span class="item-collection__meta">
      <span class="item-collection__page">
        page {{ page.current }}<span class="item-collection__page-sep">/</span>{{ page.count }}
      </span>
      <span class="item-collection__meta-sep" aria-hidden="true">·</span>
      <span class="item-collection__total">{{ page.totalItems }} {{ page.itemsPlural }}</span>
    </span>
    }
  </header>
  }

  <div class="item-collection__grid">
    @for (item of view().items; track item.ref) {
    <app-item-view [view]="item" />
    } @empty {
    <p class="item-collection__empty">{{ view().emptyMessage }}</p>
    }
  </div>
</div>
