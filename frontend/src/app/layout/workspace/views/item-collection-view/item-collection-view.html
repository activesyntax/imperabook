<div class="item-collection">
  <!-- A listbox may only hold options, so the empty message sits outside it. -->
  @if (view().items.length > 0) {
  <div class="item-collection__grid" role="listbox" aria-label="Items">
    @for (item of view().items; track item.ref) {
    <app-item-view [view]="item" />
    }
  </div>
  } @else {
  <p class="item-collection__empty">{{ view().emptyMessage }}</p>
  }
</div>
