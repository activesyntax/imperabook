<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
  stroke-linejoin="round" aria-hidden="true">
  @switch (view().kind) {
  @case ('success') {
  <circle cx="12" cy="12" r="9" />
  <path d="m8.5 12 2.5 2.5 4.5-5" />
  }
  @case ('error') {
  <circle cx="12" cy="12" r="9" />
  <path d="M12 8v4.5M12 16h.01" />
  }
  @case ('warning') {
  <path d="M12 4 2.5 20h19z" />
  <path d="M12 10v4M12 17.5h.01" />
  }
  @default {
  <circle cx="12" cy="12" r="9" />
  <path d="M12 8h.01M11 11.5h1V16h1" />
  }
  }
</svg>

<header class="bar">
  <span class="bar-title">{{ label() }}</span>
</header>

<div class="body">
  <p class="message">{{ view().text }}</p>
</div>
