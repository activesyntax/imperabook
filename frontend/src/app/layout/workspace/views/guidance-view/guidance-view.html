<header class="bar">
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="2" y="6" width="20" height="12" rx="2" />
    <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6" />
  </svg>
  <span class="bar-title">{{ view().title }}</span>
</header>

<div class="body">
  @if (view().intro; as intro) {
    <p class="intro">{{ intro }}</p>
  }
  <ul class="hints">
    @for (hint of view().hints; track hint.label) {
      <li class="hint">
        <span class="keys">
          @for (key of hint.keys; track key) {
            <kbd class="key">{{ key }}</kbd>
          }
        </span>
        <span class="label">{{ hint.label }}</span>
      </li>
    }
  </ul>
</div>
