<nav class="nav" aria-label="Pinned commands">
  <p class="nav__title">Pinned commands</p>

  <ul class="nav__list">
    @for (cmd of pinned(); track cmd.command) {
    <li>
      <button type="button" class="pin" [attr.title]="cmd.description" (mousedown)="$event.preventDefault()">
        <span class="pin__icon" aria-hidden="true">
          @switch (cmd.command) {
          @case ('dashboard') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
          </svg>
          }
          @case ('help') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M9.2 9.2a3 3 0 0 1 5.8 1c0 2-2.9 2.5-2.9 4" />
            <path d="M12 17.5h.01" />
          </svg>
          }
          @case ('settings') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M4 6h16M4 12h16M4 18h16" />
            <circle cx="9" cy="6" r="2" />
            <circle cx="15" cy="12" r="2" />
            <circle cx="9" cy="18" r="2" />
          </svg>
          }
          @default {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="m8 6 6 6-6 6" />
          </svg>
          }
          }
        </span>
        <span class="pin__name">{{ cmd.command }}</span>
      </button>
    </li>
    } @empty {
    <li class="nav__empty">no pinned commands</li>
    }
  </ul>

  <span class="nav__spacer" aria-hidden="true"></span>

  <app-user-badge [name]="name()" [library]="library()" [avatarUrl]="avatarUrl()" />
</nav>
