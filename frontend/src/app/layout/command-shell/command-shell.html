<section class="shell" role="region" aria-label="Command shell">
  <div class="main">
    <div class="suggestions" role="listbox" aria-label="Suggestions">
        @for (cmd of suggestions(); track cmd; let i = $index) {
          <button
            type="button"
            class="chip"
            role="option"
            [class.active]="i === selectedIndex()"
            [attr.aria-selected]="i === selectedIndex()"
            (mousedown)="$event.preventDefault()">
            {{ cmd }}
          </button>
        } @empty {
          <span class="fall">no commands</span>
        }
    </div>

    <div class="entry">
      <div class="prompt">
        <img class="avatar" src="/static/imperabook-icon.svg" alt="" aria-hidden="true" />

          <input
            #bar
            class="bar"
            [type]="commandField.type"
            [attr.name]="commandField.name"
            [attr.autocomplete]="commandField.autocomplete"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Command input"

            (input)="onInput($event)"
            [value]="text()"
            [readOnly]="busy()"
            (keydown)="onKeydown($event)" />

        <button
          type="button"
          class="send"
          aria-label="Run command"
          [disabled]="busy()"
          (mousedown)="$event.preventDefault()"
          (click)="submit()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="m13 6 6 6-6 6" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
