<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Three-book stack icon -->
  <g stroke="#3D1F12" stroke-width="14" stroke-linejoin="round">

    <!-- Book 1: left, orange, upright (baseline y=768) -->
    <rect x="245" y="258" width="160" height="510" rx="30" fill="#F2901C"/>
    <rect x="270" y="293" width="112" height="22" rx="11" fill="#FAF3E1" stroke="none"/>
    <rect x="270" y="331" width="50"  height="16" rx="8"  fill="#DCD4C7" stroke="none"/>

    <!-- Book 2: middle, cream, upright (baseline y=768) -->
    <rect x="417" y="322" width="146" height="446" rx="30" fill="#F1EBDC"/>
    <rect x="440" y="353" width="100" height="22" rx="11" fill="#FCF9F0" stroke="none"/>

    <!-- Book 3: right, orange, leaning left, resting on baseline,
         top corner just touching the middle book -->
    <g transform="rotate(-15 674 768)">
      <rect x="674" y="348" width="150" height="420" rx="30" fill="#EE821E"/>
      <rect x="700" y="384" width="90" height="16" rx="8" fill="#F8A648" stroke="none"/>
      <rect x="690" y="410" width="90" height="16" rx="8" fill="#F8A648" stroke="none"/>
    </g>

  </g>
</svg>
