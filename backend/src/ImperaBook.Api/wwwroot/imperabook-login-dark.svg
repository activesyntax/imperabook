<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 240 300" width="240" height="300" role="img" aria-label="A closed door bearing the ImperaBook emblem, with the caption: Log in to open your library">
  <title>Log in to open your library</title>

  <defs>
    <linearGradient id="ib-under" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#f0c184" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#f0c184" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ib-floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c07a3e" stop-opacity="0" />
      <stop offset="50%" stop-color="#c07a3e" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c07a3e" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ib-arrow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#c07a3e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c07a3e" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Light escaping under the door -->
  <path d="M 52 214 L 148 214 L 168 232 L 32 232 Z" fill="url(#ib-under)" />
  <path d="M 52 213 L 148 213" stroke="#f0c184" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" />

  <!-- Floor -->
  <path d="M 16 214 L 184 214" stroke="url(#ib-floor)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Door frame -->
  <path d="M 38 214 L 38 26 L 162 26 L 162 214"
        fill="none" stroke="#c07a3e" stroke-width="4" stroke-linejoin="round" />

  <!-- Door leaf -->
  <rect x="46" y="32" width="108" height="181" rx="3" fill="#17130f" stroke="#3d1f12" stroke-width="3" />

  <!-- Inner frame (molding), inset from the stiles and rails -->
  <rect x="58" y="44" width="84" height="157" rx="2" fill="none" stroke="#c07a3e" stroke-opacity="0.45" stroke-width="1.6" />

  <!-- Hinges, on the hinge stile -->
  <g fill="#c07a3e" fill-opacity="0.75">
    <rect x="48" y="58" width="7" height="14" rx="1.5" />
    <rect x="48" y="172" width="7" height="14" rx="1.5" />
  </g>

  <!-- Round knob -->
  <circle cx="147" cy="129" r="4.5" fill="#c07a3e" />

  <!-- Emblem: the logo's icon verbatim, only placed and scaled.
       Geometry is copied unchanged from imperabook-logo-dark.svg so the two cannot drift. -->
  <g transform="translate(56.81 67.56) scale(0.078)">
    <g stroke="#3d1f12" stroke-width="14" stroke-linejoin="round" transform="translate(25.820896,-250.99997)">
      <!-- Book 1: left, copper, upright (baseline y=768) -->
      <rect x="245" y="258" width="160" height="510" rx="30" fill="#b26829" />
      <rect x="270" y="293" width="112" height="22" rx="11" fill="#faf3e1" stroke="none" />
      <rect x="270" y="331" width="50" height="16" rx="8" fill="#dcd4c7" stroke="none" />
      <!-- Book 2: middle, cream, upright (baseline y=768) -->
      <rect x="407" y="322" width="146" height="446" rx="30" fill="#f1ebdc" />
      <rect x="440" y="353" width="100" height="22" rx="11" fill="#fcf9f0" stroke="none" />
      <!-- Book 3: right, copper, leaning left, top corner just touching the middle book -->
      <g transform="rotate(-15,672,783.1915)">
        <rect x="670.13635" y="346.96472" width="150" height="420" rx="30" fill="#a75122" />
        <rect x="700" y="384" width="90" height="16" rx="8" fill="#f8a648" stroke="none" />
        <rect x="690" y="410" width="90" height="16" rx="8" fill="#f8a648" stroke="none" />
      </g>
    </g>
  </g>

  <!-- Caption. "Log in" rather than "Sign in", to match the `login` command. -->
  <text x="100" y="254" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', 'Courier New', monospace"
        font-size="10.5" letter-spacing="0.3" fill="#ded5c8">Log in to open your library.</text>

  <!-- Arrow pointing down to the command bar -->
  <g stroke="url(#ib-arrow)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 100 268 L 100 288" />
    <path d="M 93 281.5 L 100 289 L 107 281.5" />
  </g>
</svg>
