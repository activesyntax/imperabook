services:
  db:
    image: postgres:17
    container_name: imperabook-db
    environment:
      POSTGRES_USER: imperabook
      POSTGRES_PASSWORD: imperabook
      POSTGRES_DB: imperabook
    ports:
      - "5432:5432"
    volumes:
      - imperabook-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imperabook -d imperabook"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  imperabook-pgdata:
