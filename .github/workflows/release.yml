name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without the leading v — e.g. 0.1.0'
        required: true
      latest:
        description: 'Also tag this image as latest'
        type: boolean
        default: true

permissions:
  contents: write   # needed to create the GitHub release
  packages: write   # needed to push to GHCR

# One release at a time. Never cancel a run in progress: a cancelled build can
# leave some tags pushed and others not.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs first and fails in seconds, so a bad version never costs a test run.
  # A release is not idempotent: the tag, the source archives and the generated
  # notes all belong to the first run. Re-running for an existing version leaves
  # the tag on its original commit and appends a second changelog. So it is
  # rejected outright rather than half-applied.
  guard:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check format and availability
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version. Expected e.g. 0.1.0 — no leading v."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION already exists. Releases are immutable — bump the version."
            exit 1
          fi

  # Same fast suite that runs on every pull request.
  unit:
    needs: guard
    uses: ./.github/workflows/ci.yml

  # The Testcontainers suite, excluded from the fast loop by design.
  integration:
    name: Integration tests (Testcontainers)
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Integration tests
        run: >
          dotnet test --configuration Release
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: release-integration-test-results
          path: TestResults/*.trx

  release:
    name: Build, push and publish
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=false: the action would otherwise add `latest` automatically
          # for any matching semver tag, overriding the workflow input below.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # The compose file is the distribution entry point: the repository is
      # private, so this release asset is how a self-hosting user gets it.
      # The tag is created here, on the commit this run built.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: deploy/docker-compose.yml
          fail_on_unmatched_files: true
